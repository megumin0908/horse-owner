 const np=auNext(),cap=AU.mode==='open'?3:6,c=AU.rivals.filter(r=>{const rv=G.rv[r.i];return r.max[AU.idx]>=np&&AU.leader!==r.n&&rv.horses.length<cap&&np<=rv.money-rvReserve(rv)});
 if(c.length&&Math.random()<(AU.leader?.7:.9))auBid(pick(c).n);
 else if(++AU.count>=3)auSold();
}

  log(`🔨 경매에서 <b>${esc(h.name)}</b> 낙찰 (${won(AU.price)}) · 잠재력 ${real}`);
 }else if(AU.leader){const rv=G.rv.find(r=>r.n===AU.leader);if(rv){rv.money-=AU.price;h.own=rv.i;h.price=AU.price;rv.horses.push(h)}
  AU.result=`${AU.leader}이(가) ${won(AU.price)}에 낙찰했다. 레이스에서 만날지도...`;}
 else AU.result='입찰자가 없어 유찰되었다.';
}

 RS={queue:races.filter(watchRace),idx:0,results:[]};for(const r of races.filter(r=>!watchRace(r)))RS.results.push(...simInstant(r));
 if(RS.queue.length)prepRace();else weekEnd();

function buildField(race,mine){
 const runners=[],used=new Set();
 for(const e of mine){const h=hById(e.hid);runners.push(mkRunner(h,'p',race,e));used.add(h.name)}
 for(const e of G.rvEntries.filter(x=>x.rid===race.id)){const h=rvH(e.hid);if(!h||h.inj)continue;runners.push(mkRunner(h,'r',race,null));used.add(h.name)}
 const o=raceStr(race),cs=COLORS.filter(c=>!runners.some(r=>r.color===c)),pool=namePool(race.abroad);
 while(runners.length<10){let n,t=0;do{n=pick(pool);t++}while(used.has(n)&&t<60);used.add(n);
  const src={name:n,color:cs[runners.length%cs.length]||pick(COLORS),apt:{sprint:'B',mile:'B',mid:'B',long:'B'},s:{}};
  src.apt[DCAT(race.d)]=pick(['A','A','A','B']);for(const [k] of STATS)src.s[k]=Math.round(o*R(.85,1.15));
  runners.push(mkRunner(src,'x',race,null))}
 runners.sort(()=>Math.random()-.5).forEach((r,i)=>{r.lane=i;r.no=i+1});return runners;
}

function setPopularity(rf,race){const need=Math.max(50,.27*race.d-200),sc=r=>(r.s.spd+r.s.pow*.4+r.s.guts*.2+r.s.wit*.2)*r.apt*r.mul*(.75+.25*Math.min(1,r.hp/need/1.6))*R(.97,1.03);
 [...rf].sort((a,b)=>sc(b)-sc(a)).forEach((r,i)=>{r.pop=i+1;r.odds=(1.4+Math.pow(i,1.45)*.95+R(0,.4)).toFixed(1)})}
function speak(t,done,minMs){let fired=false;const fin=()=>{if(fired)return;fired=true;if(done)done()};const clean=t.replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,'');

 if(!S||typeof SpeechSynthesisUtterance==='undefined'){setTimeout(fin,minMs||1500);return}
 try{const u=new SpeechSynthesisUtterance(clean);u.lang='ko-KR';u.rate=1.3;u.pitch=1.05;const t0=Date.now();
  u.onend=()=>{const w=Math.max(0,(minMs||0)-(Date.now()-t0));setTimeout(fin,w+150)};u.onerror=()=>setTimeout(fin,minMs||1500);
  setTimeout(fin,Math.max(minMs||0,clean.length*260+2500));
  if(S.speaking||S.pending)S.cancel();S.speak(u)}catch(e){setTimeout(fin,minMs||1500)}}
